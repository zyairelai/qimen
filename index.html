<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>疯后奇门</title>
  <link rel="apple-touch-icon" sizes="512x512" href="favicon/icon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="favicon/favicon.png">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/picker.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/history.css">
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
  <script src="qimen/ai.js"></script>
  <script src="qimen/bamen.js"></script>
  <script src="qimen/bashen.js"></script>
  <script src="qimen/dipan.js"></script>
  <script src="qimen/jieqi.js"></script>
  <script src="qimen/stars.js"></script>
  <script src="qimen/tianpan.js"></script>
  <script src="qimen/ui.js"></script>
  <script src="qimen/wuxing.js"></script>
  <script src="qimen/xunshou.js"></script>
  <script src="qimen/yima.js"></script>
  <script src="qimen/zhifu.js"></script>
  <script src="qimen/zhishi.js"></script>
</head>

<body>

  <div class="top-bar">
    <div class="controls">
      <!-- <button id="prevDayBtn">◀◀</button> -->
      <button id="prevBtn">◀</button>
      <div class="datetime-display" id="dateShow">Loading...</div>
      <button id="nextBtn">▶</button>
      <!-- <button id="nextDayBtn">▶▶</button> -->
      <button id="nowBtn" title="Reset to Current Time">🔄</button>
      <button id="copyBtn" title="Copy to Clipboard for AI Analysis">📋</button>
    </div>
    <div class="lunar-info" id="lunarShow">LOADING...</div>
  </div>

  <div class="picker-overlay" id="overlay">
    <div class="custom-picker">
      <div class="picker-header">
        <span id="prevMonth">◀</span>
        <div id="monthYearTitle">
          <span id="selectMonthText"></span>
          <span id="selectYearText"></span>
        </div>
        <span id="nextMonth">▶</span>
      </div>
      <div class="picker-grid" id="daysGrid"></div>
      <div class="time-setter">
        <input type="time" id="timeInput">
        <button id="confirmTimeBtn">OK</button>
      </div>
    </div>
  </div>

  <div class="grid-container" id="qimenGrid">
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">四绿巽木</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">九紫离火</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">二黑坤土</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">三碧震木</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">五黄中宫</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">七赤兑金</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">八白艮土</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">一白坎水</span>
    </div>
    <div class="grid-item">
      <div class="main-content"></div> <span class="position">六白干金</span>
    </div>
  </div>

  <script src="scripts/main.js"></script>
  <script src="scripts/button.js"></script>
  <script src="scripts/calendar.js"></script>
  <script src="scripts/clipboard.js"></script>
  <script src="scripts/history.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>

  <div class="bottom-controls" id="bottomControls">
    <button id="historyBtn">📜 History</button>
    <button id="saveBtn">💾 Save</button>
  </div>

  <div class="history-modal" id="historyModal">
    <div class="history-content">
      <div class="history-header">
        <div class="header-left">
          <h3>Saved History</h3>
          <select id="historySort" class="history-sort-select">
            <option value="name">Name (A-Z)</option>
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
        <button id="closeHistory">✕</button>
      </div>
      <div id="historyList" class="history-list">
        <!-- History entries will be injected here -->
      </div>
    </div>
  </div>


</body>

</html>
